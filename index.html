<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard de Proyectos de Visualización</title>

    <style>

       

        body {

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";

            background-color: #1a1a2e; /* Fondo oscuro (Azul Medianoche) */

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            min-height: 100vh;

            margin: 0;

            padding: 20px;

            color: #333;

        }



        .container {

            text-align: center;

            background-color: #ffffff;

            padding: 40px;

            border-radius: 12px;

            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);

            max-width: 900px;

            width: 100%;

        }



        h1 {

            color: #1a2a47;

            margin-bottom: 5px;

            font-size: 2.2em;

        }



       

        #course-name {

            color: #007bff;

            margin-top: 0;

            margin-bottom: 5px;

            font-size: 1.4em;

            font-weight: 500;

        }

        

        #student-name {

            color: #666;

            margin-top: 0;

            margin-bottom: 30px;

            font-size: 1.1em;

            font-weight: 400;

        }



        p {

            margin-bottom: 40px;

            color: #666;

            font-size: 1.1em;

        }



       

        .button-grid {

            display: grid;

            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); /* Minwidth ajustado para 5 botones */

            gap: 20px;

        }



       

        .tool-button {

            display: block;

            padding: 15px 25px;

            text-decoration: none;

            color: #ffffff;

            background-color: #007bff;

            border: none;

            border-radius: 8px;

            font-size: 1.1em;

            font-weight: 600;

            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;

            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);

        }



        .tool-button:hover {

            background-color: #0056b3;

            transform: translateY(-2px);

            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);

        }



        

        .rawgraph { background-color: #ff6f61; }

        .rawgraph:hover { background-color: #e55a4d; }



        .flourish { background-color: #3cb371; }

        .flourish:hover { background-color: #31945c; }



        .datawrapper { background-color: #ffc107; color: #333; }

        .datawrapper:hover { background-color: #e0a800; }



        .tableau { background-color: #4682b4; }

        .tableau:hover { background-color: #3a6a93; }



        .personales { background-color: #00bcd4; } /* Turquesa para el nuevo botón */

        .personales:hover { background-color: #0097a7; }



       

        @media (max-width: 500px) {

            .tool-button {

                font-size: 1em;

                padding: 12px 20px;

            }

        }

    </style>

</head>

<body>



    <div class="container">

        <h1>📊 Proyectos de Visualización de Datos</h1>

        

        <h2 id="course-name">(20252Q) DTS.003 - Data Science - Comisión: 2025</h2>

        <h3 id="student-name">Alumno: Gustavo Ariel Banegas</h3>

       

        <div class="button-grid">

            <a href="https://gustavobanegasok.github.io/infovis/rawgraphs/index.html" class="tool-button rawgraph" target="_blank">RawGraphs</a>

            <a href="https://gustavobanegasok.github.io/infovis/flourish/index.html" class="tool-button flourish" target="_blank">Flourish</a>

            <a href="https://gustavobanegasok.github.io/infovis/datawrapper/index.html" class="tool-button datawrapper" target="_blank">Datawrapper</a>

            <a href="https://gustavobanegasok.github.io/infovis/tableau/index.html" class="tool-button tableau" target="_blank">Tableau</a>

            <a href="https://gustavobanegasok.github.io/infovis/personales/index.html" class="tool-button personales" target="_blank">TP Datos Personales</a>

        </div>

    </div>



</body>

</html>
