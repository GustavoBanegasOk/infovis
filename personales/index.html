<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP Datos Personales - Visualización</title>
    <style>
        /* --- ESTILOS MODERNOS Y OSCUROS (Dashboard Style) --- */
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            background-color: #1a1a2e; /* Fondo oscuro (Azul Medianoche) */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; 
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .gallery {
            text-align: center;
            background-color: #ffffff; /* Contenedor Blanco */
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            max-width: 1000px; /* Ancho ampliado para los gráficos */
            width: 100%;
            margin-top: 50px;
            margin-bottom: 50px;
        }

        /* --- TÍTULOS --- */
        
        h1 {
            color: #00bcd4; /* Color TP Personales: Turquesa */
            margin-bottom: 5px;
            font-size: 2.2em;
        }
        
        .subtitle {
            color: #666;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 1.1em;
            font-weight: 400;
        }

        h2 {
            color: #1a2a47; /* Azul Oscuro para subtítulos */
            margin-top: 40px;
            margin-bottom: 15px;
            border-bottom: 2px solid #00bcd4; /* Línea separadora con color Turquesa */
            padding-bottom: 5px;
            font-size: 1.5em;
        }

        /* --- CONTENIDO DE GRÁFICOS (Estilo y dimensiones) --- */

        .graph-object {
            /* Clase aplicada a los objetos SVG para darles un aspecto consistente */
            width: 100%;
            height: auto;
            min-height: 500px; 
            margin-bottom: 30px;
            border: 1px solid #ddd;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
            border-radius: 6px;
        }
        
        /* --- BOTÓN DE REGRESO (Estilo Dashboard) --- */

        .back-button {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 25px;
            text-decoration: none;
            color: #ffffff;
            background-color: #1a2a47; /* Color Azul Oscuro (Neutro) */
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .back-button:hover {
            background-color: #0d182a;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="gallery">
        <h1>🩺 Visualización de Datos Personales</h1>
        <p class="subtitle">Análisis de Presión Sistólica, Diastólica y Pulso a lo largo del tiempo.</p>
        
        <h2>Gráfico 1: Tendencia de Presión y Pulso (Line Chart)</h2>
        <object class="graph-object" data="https://gustavobanegasok.github.io/infovis/personales/linechart.svg" type="image/svg+xml">
            Tu navegador no soporta SVG o el archivo no se ha cargado correctamente.
        </object>
        
        <h2>Gráfico 2: Título del Gráfico de Presión</h2>
        <object class="graph-object" data="https://gustavobanegasok.github.io/infovis/personales/presion.svg" type="image/svg+xml">
            Tu navegador no soporta SVG o el archivo no se ha cargado correctamente.
        </object>
        
        <h2>Gráfico 3: Diagrama Aluvial</h2>
        <object class="graph-object" data="https://gustavobanegasok.github.io/infovis/personales/alluvialdiagram.svg" type="image/svg+xml">
            Tu navegador no soporta SVG o el archivo no se ha cargado correctamente.
        </object>
        
        <a href="../index.html" class="back-button">← Volver al Índice Principal</a>
    </div>
</body>
</html>
