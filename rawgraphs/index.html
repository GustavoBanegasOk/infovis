
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RawGraphs - Gráficos </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fa;
            text-align: center;
            padding: 20px;
        }
        .gallery {
            max-width: 1000px; /* Ancho ampliado para los gráficos */
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #ff6f61;
            margin-bottom: 30px;
        }
        h2 {
            color: #1a1a2e;
            margin-top: 40px;
            margin-bottom: 15px;
            border-bottom: 2px solid #ff6f61;
            padding-bottom: 5px;
        }
        /* Estilo para el contenedor del objeto */
        .graph-object {
            width: 100%;
            height: auto;
            min-height: 450px; /* Altura mínima para asegurar visibilidad */
            margin-bottom: 30px;
            border: 1px solid #ccc;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }
        .back-button {
            margin-top: 30px;
            display: inline-block;
            padding: 10px 20px;
            background-color: #4682b4;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .back-button:hover {
            background-color: #3a6a93;
        }
    </style>
</head>
<body>
    <div class="gallery">
        <h1>📊 Gráficos RawGraphs </h1>
        
        <h2>Gráfico 1</h2>
        <object class="graph-object" data="./grafico1.svg" type="image/svg+xml">
             Tu navegador no soporta SVG. Por favor, descarga el archivo: <a href="./grafico1.svg">grafico1.svg</a>
        </object>

        <h2>Gráfico 2</h2>
        <object class="graph-object" data="./circular_dendrogram.svg" type="image/svg+xml">
             Tu navegador no soporta SVG. Por favor, descarga el archivo: <a href="./grafico2.svg">grafico2.svg</a>
        </object>
        
        <h2>Gráfico 3</h2>
        <object class="graph-object" data="./sunburst_diagram.svg" type="image/svg+xml">
             Tu navegador no soporta SVG. Por favor, descarga el archivo: <a href="./grafico3.svg">grafico3.svg</a>
        </object>
        
        <a href="https://gustavobanegasok.github.io/infovis/index.html" class="back-button">← Volver al Índice Principal</a>
    </div>
</body>
</html>
