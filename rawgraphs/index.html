
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RawGraphs - Galería de Gráficos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fa;
            text-align: center;
            padding: 20px;
        }
        .gallery {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #ff6f61; /* Color RawGraphs */
            margin-bottom: 30px;
        }
        .graph-list a {
            display: block;
            margin: 15px 0;
            padding: 10px;
            text-decoration: none;
            color: #1a1a2e;
            background-color: #ffeadc;
            border: 1px solid #ff6f61;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .graph-list a:hover {
            background-color: #ff6f61;
            color: white;
        }
        .back-button {
            margin-top: 30px;
            display: inline-block;
            padding: 10px 20px;
            background-color: #4682b4;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="gallery">
        <h1>Galería de Gráficos RawGraphs</h1>
        <div class="graph-list">
            <a href="grafico1.svg">Gráfico 1: Título o Descripción del Gráfico</a>
            <a href="grafico2.svg">Gráfico 2: Título o Descripción del Gráfico</a>
            <a href="grafico3.svg">Gráfico 3: Título o Descripción del Gráfico</a>
        </div>
        <a href="../index.html" class="back-button">← Volver al Dashboard Principal</a>
    </div>
</body>
</html>
