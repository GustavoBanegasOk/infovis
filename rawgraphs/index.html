<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RawGraphs - Gráficos de Visualización</title>
    <style>
        /* --- ESTILOS MODERNOS Y OSCUROS (Dashboard Style) --- */
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            background-color: #1a1a2e; /* Fondo oscuro (Azul Medianoche) */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; 
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .gallery {
            text-align: center;
            background-color: #ffffff; /* Contenedor Blanco */
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            max-width: 1000px; /* Ancho ampliado para los gráficos */
            width: 100%;
            margin-top: 50px;
            margin-bottom: 50px;
        }

        /* --- TÍTULOS --- */
        
        h1 {
            color: #ff6f61; /* Color RawGraphs */
            margin-bottom: 5px;
            font-size: 2.2em;
        }
        
        .subtitle {
            color: #666;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 1.1em;
            font-weight: 400;
        }

        h2 {
            color: #1a2a47; /* Azul Oscuro para subtítulos */
            margin-top: 40px;
            margin-bottom: 15px;
            border-bottom: 2px solid #ff6f61; /* Línea separadora con color RawGraphs */
            padding-bottom: 5px;
            font-size: 1.5em;
        }

        /* --- CONTENIDO DE GRÁFICOS --- */

        .graph-object {
            width: 100%;
            height: auto;
            min-height: 450px; 
            margin-bottom: 30px;
            border: 1px solid #ddd; /* Borde más sutil */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
            border-radius: 6px;
        }

        /* --- BOTÓN DE REGRESO (Estilo Dashboard) --- */

        .back-button {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 25px;
            text-decoration: none;
            color: #ffffff;
            background-color: #1a2a47; /* Color Azul Oscuro (Neutro) */
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .back-button:hover {
            background-color: #0d182a;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="gallery">
        <h1>📊 Gráficos RawGraphs</h1>
        <p class="subtitle">Análisis y visualización de datos utilizando la herramienta RawGraphs.</p>
        
        <h2>Gráfico 1: Título Descriptivo</h2>
        <object class="graph-object" data="./grafico1.svg" type="image/svg+xml">
              Tu navegador no soporta SVG. Por favor, descarga el archivo: <a href="./grafico1.svg">grafico1.svg</a>
        </object>

        <h2>Gráfico 2: Título Descriptivo</h2>
        <object class="graph-object" data="./circular_dendrogram.svg" type="image/svg+xml">
              Tu navegador no soporta SVG. Por favor, descarga el archivo: <a href="./circular_dendrogram.svg">circular_dendrogram.svg</a>
        </object>
        
        <h2>Gráfico 3: Título Descriptivo</h2>
        <object class="graph-object" data="./sunburst_diagram.svg" type="image/svg+xml">
              Tu navegador no soporta SVG. Por favor, descarga el archivo: <a href="./sunburst_diagram.svg">sunburst_diagram.svg</a>
        </object>
        
        <a href="../index.html" class="back-button">← Volver al Índice Principal</a>
        </div>
</body>
</html>
